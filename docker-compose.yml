version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unthinkable-summarizer-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=https://unthinkable-summarizer.onrender.com/
      - MONGODB_URI=mongodb://mongo:27017/unthinkable_summarizer
      - JWT_SECRET=unthinkable_production_secure_jwt_secret_key_32_chars_long
      - ANONYMOUS_SESSION_TTL_HOURS=24
      - MAX_FILE_SIZE_MB=25
      - MAX_FILES_PER_REQUEST=5
      # Document Extraction & AI Providers
      - EXTRACTION_PROVIDER=auto
      - LLMWHISPERER_API_KEY=${LLMWHISPERER_API_KEY:-}
      - AI_PROVIDER=${AI_PROVIDER:-deterministic}
      - AI_API_KEY=${AI_API_KEY:-}
      - AI_BASE_URL=${AI_BASE_URL:-https://api.openai.com/v1}
      - AI_MODEL=${AI_MODEL:-gpt-4o-mini}
      - OCR_PROVIDER=tesseract
      # Internal Cron Scheduler
      - CRON_ENABLED=true
      - CRON_CLEANUP_INTERVAL_MINUTES=30
      - CRON_HEARTBEAT_INTERVAL_MINUTES=15
    volumes:
      - app_uploads:/app/uploads
    depends_on:
      - mongo
    networks:
      - unthinkable_network

  mongo:
    image: mongo:7.0-alpine
    container_name: unthinkable-summarizer-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - unthinkable_network

volumes:
  app_uploads:
  mongo_data:

networks:
  unthinkable_network:
    driver: bridge
